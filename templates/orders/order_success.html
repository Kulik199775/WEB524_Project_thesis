{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="card shadow">
                <div class="card-body py-5">
                    <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
                    <h2 class="mt-3">Спасибо за заказ!</h2>
                    <p class="lead">Ваш заказ #{{ order.id }} успешно оплачен.</p>
                    <p>Подтверждение отправлено на email: <strong>{{ order.email }}</strong></p>
                    <hr>
                    <a href="{% url 'catalog:home' %}" class="btn btn-success">
                        <i class="bi bi-shop"></i> Продолжить покупки
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
